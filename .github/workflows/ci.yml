name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, type-check, test (lightweight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check python tests
      - run: python -m mypy python
      - run: python -m pytest

  test-rl:
    name: Test (rl extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch first so the rl extra's "torch>=2.2" is already
      # satisfied and pip doesn't pull the much larger CUDA wheel.
      - run: python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,rl]"
      - run: python -m pytest

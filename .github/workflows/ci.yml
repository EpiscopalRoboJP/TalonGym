name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint, type-check, test (lightweight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check python tests
      - name: Pytest
        run: python -m pytest
        # Season CAD (field.glb, cad_manifest.json, MJCF) is committed.
        # require_mesh still skips without the mujoco extra.

  test-rl:
    name: Test (rl extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch first so the rl extra's "torch>=2.2" is already
      # satisfied and pip doesn't pull the much larger CUDA wheel.
      - run: python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,rl]"
      - run: python -m pytest

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

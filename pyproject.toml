[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talongym"
version = "0.5.19"
description = "Season-agnostic FTC Autonomous RL trainer and 3D strategy lab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "FTC Team 17986 904 Robo Eagles" },
  { name = "FTC Team 27268 Talon Strike" },
]
keywords = [
  "ftc",
  "first-tech-challenge",
  "reinforcement-learning",
  "robotics",
  "simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "gymnasium>=0.29",
  "pettingzoo>=1.24",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "pydantic>=2.7",
  "jsonschema>=4.23",
  "websockets>=12.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/TalonStrikeJP/TalonGym"
Issues = "https://github.com/TalonStrikeJP/TalonGym/issues"
Documentation = "https://github.com/TalonStrikeJP/TalonGym/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.16", "mypy>=1.13"]
rl = ["stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch>=2.2"]
scale = ["ray[rllib]>=2.10"]
mujoco = ["mujoco>=3.1"]
cad = ["trimesh>=4.0", "cascadio>=0.0.13", "scipy>=1.11", "fast-simplification>=0.1"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
talongym = "talongym.cli:app"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
talongym = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = [
  "require_mesh: do not planar-fallback a mesh field; skip without mujoco+CAD",
  "require_cad: skip unless derived season CAD files exist",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: pre-existing data-heavy lines (preset tables, glTF buffers) routinely
# exceed any sane limit; enforce it with a formatter later instead of ratcheting.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer's dependency-injection style takes the sentinel default itself.
extend-immutable-calls = ["fastapi.File", "typer.Option"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
